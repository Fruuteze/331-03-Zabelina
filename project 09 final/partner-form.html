<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма партнёра</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="formTitle">Добавление партнёра</h1>
        </header>
        
        <main>
            <form id="partnerForm">
                <input type="hidden" id="partnerId">
                
                <div class="form-group">
                    <label for="name">Наименование компании*</label>
                    <input type="text" id="name" required placeholder="Введите название компании">
                    <div class="error-message" id="nameError"></div>
                </div>
                
                <div class="form-group">
                    <label for="type">Тип партнёра*</label>
                    <select id="type" required>
                        <option value="">Выберите тип</option>
                        <option value="retail">Розничный магазин</option>
                        <option value="wholesale">Оптовый покупатель</option>
                        <option value="online">Интернет-магазин</option>
                        <option value="distributor">Дистрибьютор</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="rating">Рейтинг*</label>
                    <input type="number" id="rating" min="0" required 
                           placeholder="Введите рейтинг" title="Введите положительное число">
                    <div class="error-message" id="ratingError"></div>
                </div>
                
                <div class="form-group">
                    <label for="address">Адрес</label>
                    <input type="text" id="address" placeholder="Введите юридический адрес">
                </div>
                
                <div class="form-group">
                    <label for="director">ФИО директора</label>
                    <input type="text" id="director" placeholder="Введите ФИО директора">
                </div>
                
                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" placeholder="+7 (XXX) XXX-XX-XX" >
                    <div class="error-message" id="phoneError"></div>
                </div>
                
                <div class="form-group">
                    <label for="email">Электронная почта</label>
                    <input type="email" id="email" placeholder="example@domain.com">
                    <div class="error-message" id="emailError"></div>
                </div>
                
                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="btn secondary">Назад</button>
                    <button type="submit" class="btn primary">Сохранить</button>
                </div>
            </form>
        </main>
    </div>

    <div id="notification" class="notification hidden">
        <div class="notification-content">
            <span id="notificationMessage"></span>
        </div>
    </div>

    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
