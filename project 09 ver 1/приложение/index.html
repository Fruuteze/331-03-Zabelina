<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Партнёры компании "Мастер пол"</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <img src="images/logo.png" alt="Логотип Мастер пол" class="logo">
            <h1>Список партнёров</h1>
        </header>
        
        <main>
            <button id="addPartnerBtn" class="btn primary">Добавить партнёра</button>
            
            <div class="table-container">
                <table id="partnersTable">
                    <thead>
                        <tr>
                            <th>Наименование</th>
                            <th>Тип</th>
                            <th>Рейтинг</th>
                            <th>Телефон</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </main>
    </div>


    <script type="module"  src="js/validation.js"></script>
    <script type="module"  src="js/app.js"></script>
</body>
</html>
